# Configuracao global do ai-jail 3.3. / Global ai-jail 3.3 configuration.
mask = [".env", ".env.*", "*.pem", "*.key", "credentials*.json"]
# Pasta do Maestri e ignore global do git (decisao de 22/11), so leitura.
# Maestri folder and global git ignore (decision of Nov 22), read-only.
ro_maps = ["__HOME__/.maestri", "__HOME__/.config/git"]

[commands.claude]
agent_state = true
# Conectores do claude.ai e login/renovacao do token (decisoes de 20 e 21/11).
# claude.ai connectors and token login/refresh (decisions of Nov 20 and 21).
allow_hosts = ["mcp-proxy.anthropic.com", "platform.claude.com"]

[commands.codex]
agent_state = true
# Renovacao do login do Codex (decisao de 22/11). / Codex login refresh (decision of Nov 22).
allow_hosts = ["auth.openai.com"]

[commands.agy]
agent_state = true
# O ai-jail nao conhece a API do Antigravity. / ai-jail does not know the Antigravity API.
allow_hosts = ["googleapis.com"]
