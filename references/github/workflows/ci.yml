# CI do padrao Fuzkrigo Projects.
#
# Um arquivo so, para qualquer stack: os passos se ligam por deteccao de
# arquivo, e o comando de teste sai do fuzkrigo.config.json — a mesma fonte
# que o motor usa localmente, entao nao ha configuracao duplicada.
#
# Para o audit rodar aqui, o motor precisa estar COMMITADO no projeto:
#   fuzkrigo-spec init --agents claude
# instala a skill em .claude/skills/fuzkrigo-spec-driven. Sem isso o passo
# de auditoria e pulado com aviso, e o CI vira so testes e cobertura.
#
# Acrescentar outra stack e adicionar um bloco condicional; nada mais muda.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Node entra sempre: o motor de auditoria roda nele, mesmo em projeto
      # que nao e JavaScript.
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Preparar Python
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias Node
        if: hashFiles('package.json') != ''
        run: npm ci || npm install

      - name: Instalar dependencias Python
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then pip install -e . || true; fi

      # O comando vem do fuzkrigo.config.json. Fonte unica: se voce mudar de
      # runner no projeto, o CI acompanha sozinho.
      - name: Rodar os testes
        run: |
          if [ ! -f fuzkrigo.config.json ]; then
            echo "sem fuzkrigo.config.json — nada a rodar"; exit 0
          fi
          CMD=$(node -p "require('./fuzkrigo.config.json').testCommand || ''")
          if [ -z "$CMD" ]; then
            echo "testCommand vazio no fuzkrigo.config.json — configure antes de confiar neste CI"; exit 1
          fi
          echo "comando: $CMD"
          eval "$CMD"

      # Os limites e as pastas de logica de negocio vem do bloco "coverage" do
      # fuzkrigo.config.json. O CI os aplica e reprova o build abaixo deles, e
      # tambem quando nao consegue medir: ferramenta ausente, bloco ausente ou
      # incompleto. A cobertura e sempre medida com ramos. Os dois passos leem
      # o bloco com .github/scripts/coverage-config.sh. No Node, o vitest so
      # aceita limite por pasta no proprio vitest.config: a A3 grava la os
      # mesmos numeros do bloco, e o CI confere o bloco antes de rodar.
      # Limits and business logic folders come from the "coverage" block of
      # fuzkrigo.config.json. CI applies them and fails the build below them,
      # and also when it cannot measure: missing tool, missing or incomplete
      # block. Coverage is always measured with branches. Both steps read the
      # block through .github/scripts/coverage-config.sh. On Node, vitest only
      # takes per-folder limits in vitest.config itself: A3 writes the block's
      # numbers there, and CI checks the block before running.
      - name: Cobertura (Node)
        if: hashFiles('package.json') != ''
        run: |
          source .github/scripts/coverage-config.sh
          skip_without_config
          if [ "$(node -p "Object.keys(require('./package.json').scripts || {}).includes('coverage')")" != true ]; then
            echo "script 'coverage' ausente no package.json — ele e obrigatorio (ex.: vitest run --coverage); configure-o na etapa A3" >&2
            exit 1
          fi
          read_coverage_config
          npm run coverage

      - name: Cobertura (Python)
        if: hashFiles('requirements.txt', 'pyproject.toml', 'setup.py') != ''
        run: bash .github/scripts/coverage-python.sh

      # No pull request o audit e informativo: auditar o projeto inteiro
      # reprovaria por causa de spec de OUTRA feature ainda em rascunho, e
      # isso nao e problema deste PR. O gate por feature ja rodou local, no
      # Portao 1.
      - name: Auditar a especificacao (informativo no PR)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          MOTOR=.claude/skills/fuzkrigo-spec-driven/scripts/fuzkrigo-spec.mjs
          if [ ! -f "$MOTOR" ]; then
            echo "motor nao encontrado em $MOTOR — rode 'fuzkrigo-spec init --agents claude' e commite"; exit 0
          fi
          node "$MOTOR" audit

      # Na main o audit e bloqueante e SEM filtro: aqui o projeto inteiro
      # precisa estar integro, incluindo specs que ficaram pela metade.
      - name: Auditar a especificacao (bloqueante na main)
        if: github.event_name == 'push'
        run: |
          MOTOR=.claude/skills/fuzkrigo-spec-driven/scripts/fuzkrigo-spec.mjs
          if [ ! -f "$MOTOR" ]; then
            echo "motor nao encontrado em $MOTOR — rode 'fuzkrigo-spec init --agents claude' e commite"; exit 0
          fi
          node "$MOTOR" audit --ci
